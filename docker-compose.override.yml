services:
    api:
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ASPNETCORE_HTTP_PORTS=8080
        ports:
            - "8080"

    notification-service:
        environment:
            DOTNET_ENVIRONMENT: Development
            ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=notifications;Username=postgres;Password=postgres"
